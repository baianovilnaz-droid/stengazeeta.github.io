<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚛️ Стенгазета по физике</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-1: #05070f;
      --bg-2: #0d1330;
      --card: rgba(22, 30, 62, 0.55);
      --stroke: rgba(120, 150, 255, 0.18);
      --accent: #6c8cff;
      --accent-2: #b06cff;
      --accent-3: #38e8ff;
      --text: #eaf0ff;
      --muted: #8f9bc7;
      --radius: 22px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-1);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Фон: плавающие формулы и градиентные пятна */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      animation: float 18s ease-in-out infinite;
    }
    .orb.a { width: 520px; height: 520px; background: #2a3fff; top: -160px; left: -120px; }
    .orb.b { width: 460px; height: 460px; background: #a23cff; bottom: -180px; right: -120px; animation-delay: -6s; }
    .orb.c { width: 360px; height: 360px; background: #00d4ff; top: 40%; left: 60%; animation-delay: -12s; opacity: 0.35; }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(40px,-30px) scale(1.08); }
    }

    .formulas {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.10;
      font-family: 'Unbounded', sans-serif;
      overflow: hidden;
    }
    .formulas span {
      position: absolute;
      white-space: nowrap;
      animation: drift linear infinite;
    }
    @keyframes drift {
      from { transform: translateY(0); }
      to { transform: translateY(-120vh); }
    }

    .container { max-width: 1040px; margin: 0 auto; padding: 32px 20px 80px; }

    /* Заголовок */
    header {
      text-align: center;
      padding: 56px 8px 40px;
      position: relative;
    }
    .badge {
      display: inline-block;
      font-size: 0.78rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-3);
      border: 1px solid var(--stroke);
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 20px;
      background: rgba(56, 232, 255, 0.06);
    }
    header h1 {
      font-family: 'Unbounded', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 5.5vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -1px;
      background: linear-gradient(100deg, var(--accent-3), var(--accent), var(--accent-2));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 8s linear infinite;
    }
    @keyframes shine {
      to { background-position: 200% center; }
    }
    header p { color: var(--muted); margin-top: 14px; font-size: 1.05rem; }

    /* Стеклянные карточки */
    .card {
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 22px;
      box-shadow:
        0 20px 50px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);
      animation: rise 0.7s cubic-bezier(.2,.8,.2,1) both;
    }
    .card:nth-child(2) { animation-delay: .05s; }
    .card:nth-child(3) { animation-delay: .1s; }
    .card:nth-child(4) { animation-delay: .15s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-family: 'Unbounded', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h2::before {
      content: "";
      width: 10px; height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-3), var(--accent-2));
      box-shadow: 0 0 14px var(--accent);
    }

    /* Постер */
    .poster-frame {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #0a0f24;
      border: 1px solid var(--stroke);
    }
    .poster-frame img {
      width: 100%;
      display: block;
      transition: transform .6s ease;
    }
    .poster-frame:hover img { transform: scale(1.02); }

    /* Кнопки */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    button {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 11px 20px;
      color: #fff;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      background-size: 180% auto;
      transition: background-position .4s, transform .15s, box-shadow .3s;
      box-shadow: 0 8px 22px rgba(108, 140, 255, 0.35);
    }
    button:hover {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(176, 108, 255, 0.45);
    }
    button.ghost {
      background: transparent;
      border: 1px solid var(--stroke);
      color: var(--text);
      box-shadow: none;
    }
    button.ghost:hover { background: rgba(120,150,255,0.08); }

    /* Поля ввода */
    input, textarea {
      font-family: inherit;
      font-size: 0.98rem;
      width: 100%;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid var(--stroke);
      background: rgba(8, 12, 28, 0.7);
      color: var(--text);
      margin-bottom: 10px;
      resize: vertical;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,140,255,0.18);
    }
    input::placeholder, textarea::placeholder { color: #5f6a95; }

    /* Комментарии */
    .comment {
      background: rgba(10, 15, 35, 0.75);
      border: 1px solid var(--stroke);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      transition: transform .2s, border-color .2s;
    }
    .comment:hover { transform: translateX(3px); border-color: rgba(120,150,255,0.35); }
    .comment .meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .comment .meta b { color: var(--accent-3); font-weight: 600; }
    .comment .text { line-height: 1.5; }
    .del {
      background: transparent !important;
      color: #ff7a90 !important;
      border: none !important;
      padding: 0 !important;
      font-size: 0.78rem;
      box-shadow: none !important;
    }
    .del:hover { text-decoration: underline; transform: none !important; }

    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 180px; }
    .status { font-size: 0.86rem; color: var(--muted); margin-top: 8px; }
    .hidden { display: none !important; }

    .admin-tag {
      background: linear-gradient(120deg, var(--accent-3), var(--accent));
      color: #04101f;
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 8px;
      margin-left: 8px;
      font-weight: 700;
      letter-spacing: .5px;
    }

    /* Скроллбар */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #080c1c; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(var(--accent), var(--accent-2));
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      .card { padding: 20px; border-radius: 18px; }
      header { padding: 32px 8px 24px; }
    }
  </style>
</head>
<body>
  <!-- Фон -->
  <div class="bg-orbs">
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
  </div>
  <div class="formulas" id="formulas"></div>

  <div class="container">
    <header>
      <span class="badge">Электронная стенгазета</span>
      <h1>Физика вокруг нас</h1>
      <p>Знания, опыты и открытия — в одной газете</p>
    </header>

    <!-- Авторизация -->
    <div id="authBox" class="card">
      <h2>Вход для администраторов</h2>
      <div class="row">
        <input id="email" type="email" placeholder="Email" />
        <input id="password" type="password" placeholder="Пароль" />
      </div>
      <div class="row">
        <button onclick="login()">Войти</button>
        <button class="ghost" onclick="register()">Зарегистрироваться</button>
      </div>
      <div id="authStatus" class="status"></div>
    </div>

    <!-- Постер -->
    <div class="card">
      <h2>Свежий выпуск</h2>
      <div class="poster-frame">
        <img id="posterImg" src="" alt="Постер стенгазеты" style="display:none">
      </div>
      <p id="noPoster" class="status">Постер ещё не загружен.</p>
      <div id="posterTools" class="toolbar hidden">
        <input type="file" id="posterFile" accept="image/png" class="hidden" />
        <button onclick="document.getElementById('posterFile').click()">📤 Загрузить PNG</button>
      </div>
    </div>

    <!-- Комментарии -->
    <div class="card">
      <h2>Комментарии</h2>
      <div id="commentForm" class="hidden">
        <textarea id="commentText" rows="3" placeholder="Поделитесь мнением о выпуске…"></textarea>
        <button onclick="addComment()">Отправить</button>
      </div>
      <p id="commentLoginHint" class="status">Войдите, чтобы оставить комментарий.</p>
      <div id="commentsList" style="margin-top:16px"></div>
    </div>

    <!-- Панель админа -->
    <div id="adminPanel" class="card hidden">
      <h2>Панель администратора</h2>
      <p class="status">Добавьте нового администратора по UID пользователя.</p>
      <div class="row">
        <input id="newAdminUid" placeholder="UID пользователя" />
        <button onclick="addAdmin()">Сделать админом</button>
      </div>
      <div id="adminsList" style="margin-top:14px"></div>
      <button class="ghost" style="margin-top:16px" onclick="logout()">Выйти</button>
    </div>
  </div>

  <script>
    // Плавающие формулы на фоне
    (function () {
      const formulas = ['E = mc²', 'F = ma', 'PV = nRT', 'λ = h/p', 'S = k·ln W',
        'Δt′ = Δt/√(1−v²/c²)', '∮E·dA = Q/ε₀', 'iħ ∂ψ/∂t = Ĥψ', 'c = 3·10⁸ м/с',
        'U = IR', 'F = G·m₁m₂/r²', 'A = πr²'];
      const box = document.getElementById('formulas');
      for (let i = 0; i < 16; i++) {
        const s = document.createElement('span');
        s.textContent = formulas[i % formulas.length];
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.fontSize = (14 + Math.random() * 22) + 'px';
        s.style.animationDuration = (18 + Math.random() * 22) + 's';
        s.style.animationDelay = (-Math.random() * 20) + 's';
        box.appendChild(s);
      }
    })();
  </script>

  <!-- Firebase-логика (та же, что в предыдущем ответе) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, onSnapshot, doc, getDoc,
      setDoc, deleteDoc, query, orderBy, serverTimestamp, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import {
      getStorage, ref, uploadBytes, getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "ВАШ_API_KEY",
      authDomain: "ВАШ_PROJECT.firebaseapp.com",
      projectId: "ВАШ_PROJECT",
      storageBucket: "ВАШ_PROJECT.appspot.com",
      messagingSenderId: "ВАШ_SENDER_ID",
      appId: "ВАШ_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentUser = null;
    let isAdminUser = false;
    let unsubComments = null;

    window.login = async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        document.getElementById('authStatus').textContent = '';
      } catch (e) {
        document.getElementById('authStatus').textContent = 'Ошибка: ' + e.message;
      }
    };

    window.register = async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, 'users', cred.user.uid), { email });
        document.getElementById('authStatus').textContent =
          'Аккаунт создан. UID: ' + cred.user.uid;
      } catch (e) {
        document.getElementById('authStatus').textContent = 'Ошибка: ' + e.message;
      }
    };

    window.logout = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        const adminDoc = await getDoc(doc(db, 'admins', user.uid));
        isAdminUser = adminDoc.exists() && adminDoc.data().active === true;

        document.getElementById('authBox').classList.add('hidden');
        document.getElementById('commentForm').classList.remove('hidden');
        document.getElementById('commentLoginHint').classList.add('hidden');

        if (isAdminUser) {
          document.getElementById('posterTools').classList.remove('hidden');
          document.getElementById('adminPanel').classList.remove('hidden');
          loadAdmins();
        }
      } else {
        isAdminUser = false;
        document.getElementById('authBox').classList.remove('hidden');
        document.getElementById('commentForm').classList.add('hidden');
        document.getElementById('commentLoginHint').classList.remove('hidden');
        document.getElementById('posterTools').classList.add('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
      }
    });

    const loadPoster = async () => {
      const s = await getDoc(doc(db, 'settings', 'poster'));
      const img = document.getElementById('posterImg');
      const no = document.getElementById('noPoster');
      if (s.exists() && s.data().url) {
        img.src = s.data().url;
        img.style.display = 'block';
        no.style.display = 'none';
      } else {
        img.style.display = 'none';
        no.style.display = 'block';
      }
    };
    loadPoster();

    document.getElementById('posterFile').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !isAdminUser) return;
      const storageRef = ref(storage, 'posters/poster_' + Date.now() + '.png');
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);
      await setDoc(doc(db, 'settings', 'poster'), { url, updated: serverTimestamp() });
      loadPoster();
    });

    window.addComment = async () => {
      if (!currentUser) return;
      const text = document.getElementById('commentText').value.trim();
      if (!text) return;
      await addDoc(collection(db, 'comments'), {
        text, authorUid: currentUser.uid, authorEmail: currentUser.email,
        createdAt: serverTimestamp()
      });
      document.getElementById('commentText').value = '';
    };

    const loadComments = () => {
      if (unsubComments) unsubComments();
      const q = query(collection(db, 'comments'), orderBy('createdAt', 'desc'));
      unsubComments = onSnapshot(q, (snap) => {
        const list = document.getElementById('commentsList');
        list.innerHTML = '';
        snap.forEach((d) => {
          const c = d.data();
          const div = document.createElement('div');
          div.className = 'comment';
          const date = c.createdAt?.toDate
            ? c.createdAt.toDate().toLocaleString('ru-RU') : '—';
          div.innerHTML = `
            <div class="meta">
              <span><b>${escapeHtml(c.authorEmail || 'Гость')}</b>
                ${isAdminUser ? `<button class="del" data-id="${d.id}">удалить</button>` : ''}
              </span>
              <span>${date}</span>
            </div>
            <div class="text">${escapeHtml(c.text)}</div>`;
          list.appendChild(div);
        });
        if (isAdminUser) {
          list.querySelectorAll('.del').forEach(btn => {
            btn.onclick = async () => {
              if (confirm('Удалить комментарий?')) {
                await deleteDoc(doc(db, 'comments', btn.dataset.id));
              }
            };
          });
        }
      });
    };
    loadComments();

    window.addAdmin = async () => {
      const uid = document.getElementById('newAdminUid').value.trim();
      if (!uid) return;
      await setDoc(doc(db, 'admins', uid), { active: true });
      document.getElementById('newAdminUid').value = '';
      loadAdmins();
    };

    const loadAdmins = async () => {
      const snap = await getDocs(collection(db, 'admins'));
      const box = document.getElementById('adminsList');
      box.innerHTML = '';
      snap.forEach(d => {
        const row = document.createElement('div');
        row.className = 'comment';
        row.innerHTML = `<span class="meta">UID: <b>${d.id}</b></span>`;
        const btn = document.createElement('button');
        btn.className = 'del';
        btn.textContent = 'снять роль';
        btn.onclick = async () => {
          if (confirm('Снять роль администратора?')) {
            await setDoc(doc(db, 'admins', d.id), { active: false }, { merge: true });
            loadAdmins();
          }
        };
        row.appendChild(btn);
        box.appendChild(row);
      });
    };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[m]));
    }
  </script>
</body>
</html>
